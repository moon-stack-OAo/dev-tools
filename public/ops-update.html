<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0f172a">
    <title>DevTools 更新管理</title>
    <style>
        :root {
            --bg: #0f172a;
            --bg-card: #1a2235;
            --bg-card2: #232b42;
            --bg-input: #283144;
            --bg-hover: #38456a;
            --text: #e8edf5;
            --text-dim: #a8b0cc;
            --text-muted: #7a84a8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.18);
            --accent-rgb: 56, 189, 248;
            --accent2: #a78bfa;
            --danger: #f87171;
            --danger-glow: rgba(248, 113, 113, 0.15);
            --warning: #fbbf24;
            --warning-glow: rgba(251, 191, 36, 0.15);
            --success: #4ade80;
            --success-glow: rgba(74, 222, 128, 0.15);
            --info: #38bdf8;
            --info-glow: rgba(56, 189, 248, 0.12);
            --border: #2a3349;
            --border-light: #48527a;
            --radius: 10px;
            --radius-sm: 7px;
            --radius-lg: 14px;
            --font-mono: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
                'Hiragino Sans GB', system-ui, sans-serif;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            --bg-terminal: #131a2c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            background-image:
                radial-gradient(ellipse at 0% 0%, rgba(var(--accent-rgb), 0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 100% 100%, rgba(167, 139, 250, 0.06) 0%, transparent 55%);
        }

        .wrap {
            max-width: 920px;
            margin: 0 auto;
            padding: 28px 20px 48px;
        }

        header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .title-block h1 {
            font-size: 1.35rem;
            font-weight: 650;
            letter-spacing: 0.02em;
            background: linear-gradient(90deg, var(--text), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .title-block p {
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .home-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.875rem;
            border: 1px solid rgba(var(--accent-rgb), 0.35);
            background: var(--accent-glow);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .home-link:hover {
            background: rgba(var(--accent-rgb), 0.22);
            box-shadow: 0 4px 14px rgba(var(--accent-rgb), 0.12);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid transparent;
            letter-spacing: 0.02em;
        }

        .badge::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 6px currentColor;
        }

        .badge-ok {
            color: var(--success);
            background: var(--success-glow);
            border-color: rgba(74, 222, 128, 0.35);
        }

        .badge-update {
            color: var(--warning);
            background: var(--warning-glow);
            border-color: rgba(251, 191, 36, 0.35);
        }

        .badge-busy {
            color: var(--info);
            background: var(--info-glow);
            border-color: rgba(56, 189, 248, 0.35);
        }

        .badge-fail {
            color: var(--danger);
            background: var(--danger-glow);
            border-color: rgba(248, 113, 113, 0.35);
        }

        .badge-unknown {
            color: var(--text-muted);
            background: rgba(122, 132, 168, 0.12);
            border-color: rgba(122, 132, 168, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 720px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .meta-box {
            background: var(--bg-card2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
        }

        .meta-box h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .meta-row {
            display: grid;
            grid-template-columns: 72px 1fr;
            gap: 8px;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .meta-row:last-child {
            margin-bottom: 0;
        }

        .meta-row .k {
            color: var(--text-muted);
        }

        .meta-row .v {
            color: var(--text-dim);
            word-break: break-all;
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        .meta-row .v.msg {
            font-family: var(--font-sans);
            color: var(--text);
        }

        .hint {
            margin-top: 12px;
            font-size: 0.82rem;
            color: var(--text-muted);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            background: rgba(122, 132, 168, 0.08);
            border: 1px solid var(--border);
        }

        .hint.warn {
            color: var(--warning);
            background: var(--warning-glow);
            border-color: rgba(251, 191, 36, 0.28);
        }

        .hint.err {
            color: var(--danger);
            background: var(--danger-glow);
            border-color: rgba(248, 113, 113, 0.28);
        }

        .hint.ok {
            color: var(--success);
            background: var(--success-glow);
            border-color: rgba(74, 222, 128, 0.28);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            padding: 9px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-primary {
            color: #0b1220;
            background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent), #000 25%));
            box-shadow: 0 2px 10px rgba(var(--accent-rgb), 0.2);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(var(--accent-rgb), 0.35);
        }

        .btn-secondary {
            color: var(--text);
            background: var(--bg-input);
            border-color: var(--border-light);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-hover);
            border-color: var(--accent);
        }

        .btn-danger {
            color: #fff;
            background: linear-gradient(180deg, var(--danger), color-mix(in srgb, var(--danger), #000 18%));
            box-shadow: 0 2px 10px rgba(248, 113, 113, 0.18);
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(248, 113, 113, 0.3);
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        label {
            font-size: 0.82rem;
            color: var(--text-dim);
        }

        input[type='password'],
        input[type='text'] {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            outline: none;
        }

        input[type='password']:focus,
        input[type='text']:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .check-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            color: var(--text-dim);
            user-select: none;
        }

        .check-row input {
            accent-color: var(--accent);
            width: 15px;
            height: 15px;
        }

        .log-tools {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        pre#logView {
            margin: 0;
            background: var(--bg-terminal);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            min-height: 220px;
            max-height: 420px;
            overflow: auto;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            line-height: 1.55;
            color: var(--text-dim);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .footer-note {
            margin-top: 8px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <div class="title-block">
            <h1>DevTools 更新管理</h1>
            <p>查看当前构建、对比远程版本并触发一键更新</p>
        </div>
        <a class="home-link" href="index.html">← 返回首页</a>
    </header>

    <section class="card">
        <div class="card-head">
            <div class="card-title">更新状态</div>
            <span class="badge badge-unknown" id="statusBadge">未知</span>
        </div>
        <div class="grid">
            <div class="meta-box">
                <h3>本地构建 (version.json)</h3>
                <div class="meta-row"><span class="k">Short SHA</span><span class="v" id="localSha">—</span></div>
                <div class="meta-row"><span class="k">Full SHA</span><span class="v msg" id="localFull">—</span></div>
                <div class="meta-row"><span class="k">构建时间</span><span class="v" id="localTime">—</span></div>
                <div class="meta-row"><span class="k">分支 / 仓库</span><span class="v msg" id="localMeta">—</span></div>
            </div>
            <div class="meta-box">
                <h3>远程 main (api/status)</h3>
                <div class="meta-row"><span class="k">Short SHA</span><span class="v" id="remoteSha">—</span></div>
                <div class="meta-row"><span class="k">Message</span><span class="v msg" id="remoteMsg">—</span></div>
                <div class="meta-row"><span class="k">时间</span><span class="v" id="remoteTime">—</span></div>
                <div class="meta-row"><span class="k">分支 / 模式</span><span class="v msg" id="remoteBranch">—</span></div>
            </div>
        </div>
        <div class="hint" id="statusHint">正在加载…</div>
    </section>

    <section class="card">
        <div class="card-head">
            <div class="card-title">操作</div>
        </div>
        <div class="form-row">
            <label for="tokenInput">更新 Token（X-Update-Token）</label>
            <input id="tokenInput" type="password" autocomplete="off" placeholder="输入 Update Token（不会写入页面）" spellcheck="false">
            <label class="check-row">
                <input id="rememberToken" type="checkbox">
                记住到 sessionStorage（关闭标签页后清除）
            </label>
        </div>
        <div class="actions">
            <button type="button" class="btn-secondary" id="btnCheck">检查更新</button>
            <button type="button" class="btn-danger" id="btnUpdate">立即更新</button>
            <button type="button" class="btn-secondary" id="btnLog">刷新日志</button>
        </div>
        <div class="hint" id="actionHint" style="display:none"></div>
    </section>

    <section class="card">
        <div class="log-tools">
            <div class="card-title">更新日志</div>
            <span id="logMeta" style="font-size:0.78rem;color:var(--text-muted)">GET api/update/log</span>
        </div>
        <pre id="logView">（暂无日志）</pre>
    </section>

    <p class="footer-note">本页仅供运维使用 · robots noindex · 请勿将 Token 提交到仓库</p>
</div>

<script>
(function () {
    'use strict';

    var TOKEN_KEY = 'devtools.updateToken';
    var pollTimer = null;
    var lastRunning = false;

    var el = {
        badge: document.getElementById('statusBadge'),
        localSha: document.getElementById('localSha'),
        localFull: document.getElementById('localFull'),
        localTime: document.getElementById('localTime'),
        localMeta: document.getElementById('localMeta'),
        remoteSha: document.getElementById('remoteSha'),
        remoteMsg: document.getElementById('remoteMsg'),
        remoteTime: document.getElementById('remoteTime'),
        remoteBranch: document.getElementById('remoteBranch'),
        statusHint: document.getElementById('statusHint'),
        actionHint: document.getElementById('actionHint'),
        tokenInput: document.getElementById('tokenInput'),
        rememberToken: document.getElementById('rememberToken'),
        logView: document.getElementById('logView'),
        logMeta: document.getElementById('logMeta'),
        btnCheck: document.getElementById('btnCheck'),
        btnUpdate: document.getElementById('btnUpdate'),
        btnLog: document.getElementById('btnLog')
    };

    function shortSha(sha) {
        if (!sha) return '—';
        var s = String(sha);
        return s.length > 7 ? s.slice(0, 7) : s;
    }

    function pick(obj, keys, fallback) {
        if (!obj) return fallback;
        for (var i = 0; i < keys.length; i++) {
            var k = keys[i];
            if (obj[k] != null && obj[k] !== '') return obj[k];
        }
        return fallback;
    }

    function formatTime(v) {
        if (v == null || v === '') return '—';
        if (typeof v === 'number') {
            var ms = v < 1e12 ? v * 1000 : v;
            try {
                return new Date(ms).toLocaleString();
            } catch (e) {
                return String(v);
            }
        }
        var d = new Date(v);
        if (!isNaN(d.getTime())) return d.toLocaleString();
        return String(v);
    }

    function setText(node, text) {
        node.textContent = text == null || text === '' ? '—' : String(text);
    }

    function setBadge(kind, label) {
        el.badge.className = 'badge badge-' + kind;
        el.badge.textContent = label;
    }

    function setHint(node, text, type) {
        node.style.display = text ? '' : 'none';
        node.textContent = text || '';
        node.className = 'hint' + (type ? ' ' + type : '');
    }

    function normalizeCommit(src) {
        src = src || {};
        var full = pick(src, ['fullSha', 'full_sha', 'sha', 'hash', 'id'], '');
        var short = pick(src, ['shortSha', 'short_sha', 'short', 'commit'], '');
        if (!short && full) short = shortSha(full);
        if (!full && short) full = short;
        return {
            sha: short || full,
            full: full || short,
            message: pick(src, ['message', 'msg', 'subject', 'commitMessage'], ''),
            time: pick(src, ['time', 'date', 'builtAt', 'buildTime', 'committedAt', 'timestamp', 'updatedAt'], ''),
            version: pick(src, ['version', 'tag', 'release'], ''),
            branch: pick(src, ['branch', 'ref'], ''),
            repo: pick(src, ['repo', 'repository'], '')
        };
    }

    function applyLocal(data) {
        var c = normalizeCommit(data);
        setText(el.localSha, shortSha(c.sha || c.full));
        setText(el.localFull, c.full || '—');
        setText(el.localTime, formatTime(c.time));
        var metaBits = [];
        if (c.branch) metaBits.push(c.branch);
        if (c.repo) metaBits.push(c.repo);
        if (c.version) metaBits.push(c.version);
        setText(el.localMeta, metaBits.length ? metaBits.join(' · ') : '—');
        return c;
    }

    function applyRemote(data) {
        var remote = normalizeCommit(data.remote || data.latest || data.target || data);
        if (!data.remote && !data.latest && data.local) {
            remote = normalizeCommit(data);
        }
        if (data.remote) remote = normalizeCommit(data.remote);
        setText(el.remoteSha, shortSha(remote.sha || remote.full));
        setText(el.remoteMsg, remote.message || '—');
        setText(el.remoteTime, formatTime(remote.time));
        var meta = data.meta || {};
        var branch = remote.branch || meta.branch || pick(data, ['branch', 'ref'], '');
        var mode = meta.mode || '';
        var repo = meta.repo || '';
        var bits = [];
        if (branch) bits.push(branch);
        if (mode) bits.push('mode=' + mode);
        if (repo) bits.push(repo);
        setText(el.remoteBranch, bits.length ? bits.join(' · ') : '—');
        return remote;
    }

    function resolveStatus(data, local, remote) {
        var s = String(pick(data, ['status', 'state'], '')).toLowerCase();
        var updating = !!(data.updating || data.inProgress || data.running || s === 'updating' || s === 'running');
        var failed = !!(data.failed || s === 'failed' || s === 'error' || s === 'fail');
        var upToDate = s === 'up_to_date' || s === 'uptodate' || s === 'latest' || s === 'ok' || data.upToDate === true;
        var canUpdate = s === 'update_available' || s === 'outdated' || s === 'behind' || data.updateAvailable === true;

        if (updating) {
            setBadge('busy', '更新中');
            return 'updating';
        }
        if (failed) {
            setBadge('fail', '失败');
            return 'failed';
        }
        if (upToDate) {
            setBadge('ok', '已是最新');
            return 'ok';
        }
        if (canUpdate) {
            setBadge('update', '可更新');
            return 'update';
        }

        var l = shortSha(local && local.sha);
        var r = shortSha(remote && remote.sha);
        if (l !== '—' && r !== '—') {
            if (l === r) {
                setBadge('ok', '已是最新');
                return 'ok';
            }
            setBadge('update', '可更新');
            return 'update';
        }

        setBadge('unknown', '未知');
        return 'unknown';
    }

    async function fetchJson(url, options) {
        var res = await fetch(url, options);
        var text = await res.text();
        var body = null;
        if (text) {
            try {
                body = JSON.parse(text);
            } catch (e) {
                body = { raw: text };
            }
        }
        return { ok: res.ok, status: res.status, body: body, text: text };
    }

    function stopPoll() {
        if (pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
        }
    }

    function startPoll() {
        if (pollTimer) return;
        pollTimer = setInterval(function () {
            loadLog().then(function (info) {
                if (info && info.running) return;
                stopPoll();
                loadVersion().then(function () {
                    return loadStatus(false);
                });
            });
        }, 2000);
    }

    async function loadVersion() {
        try {
            var r = await fetchJson('version.json', { cache: 'no-store' });
            if (!r.ok) {
                setText(el.localSha, '—');
                setText(el.localFull, '未找到 version.json');
                setText(el.localTime, '—');
                setText(el.localMeta, '—');
                return null;
            }
            return applyLocal(r.body || {});
        } catch (e) {
            setText(el.localFull, '加载失败: ' + (e.message || e));
            return null;
        }
    }

    async function loadStatus(showActionHint) {
        setHint(el.statusHint, '正在拉取远程状态…');
        try {
            // 相对路径，兼容子路径部署如 /dev-tools/
            var r = await fetchJson('api/status', { cache: 'no-store' });
            if (!r.ok) {
                setBadge('unknown', '未知');
                setText(el.remoteSha, '—');
                setText(el.remoteMsg, '—');
                setText(el.remoteTime, '—');
                setText(el.remoteBranch, '—');
                var errBody = pick(r.body || {}, ['error', 'message'], '');
                setHint(
                    el.statusHint,
                    'Agent 未连接或未配置反代（HTTP ' + r.status + (errBody ? '：' + errBody : '') + '）',
                    'warn'
                );
                if (showActionHint) setHint(el.actionHint, '检查更新失败：Agent 未连接或未配置反代', 'err');
                return null;
            }
            var data = r.body || {};
            if (data.local) applyLocal(Object.assign({}, data.local));
            var remote = applyRemote(data);
            var local = normalizeCommit(data.local || {
                shortSha: el.localSha.textContent,
                fullSha: el.localFull.textContent,
                time: el.localTime.textContent
            });
            var kind = resolveStatus(data, local, remote);
            var msg = pick(data, ['message', 'detail', 'msg'], '');
            if (data.error) {
                msg = (msg ? msg + ' · ' : '') + '远程查询异常：' + data.error;
            }
            if (!msg) {
                if (kind === 'ok') {
                    msg = '本地 version.json 与远程 main 一致，无需更新。';
                } else if (kind === 'update') {
                    msg =
                        '远程 main 有新提交。立即更新将下载 Release latest-dist 资产（需 CI 已发布到该 commit）。';
                } else if (kind === 'updating') {
                    msg = '更新任务进行中，日志将自动刷新。';
                } else if (kind === 'failed') {
                    msg = '上次更新失败，请查看日志后重试。';
                } else {
                    msg = '已连接 Agent，状态见徽章。';
                }
            }
            setHint(
                el.statusHint,
                msg,
                kind === 'failed' || data.error ? 'err' : kind === 'ok' ? 'ok' : kind === 'update' ? 'warn' : ''
            );
            if (showActionHint) {
                setHint(
                    el.actionHint,
                    data.error ? '远程状态异常：' + data.error : '状态已刷新',
                    data.error || kind === 'failed' ? 'err' : 'ok'
                );
            }
            return data;
        } catch (e) {
            setBadge('unknown', '未知');
            setText(el.remoteSha, '—');
            setText(el.remoteMsg, '—');
            setText(el.remoteTime, '—');
            setText(el.remoteBranch, '—');
            setHint(el.statusHint, 'Agent 未连接或未配置反代', 'warn');
            if (showActionHint) setHint(el.actionHint, '检查更新失败：' + (e.message || e), 'err');
            return null;
        }
    }

    async function loadLog() {
        el.logMeta.textContent = '加载中…';
        try {
            var r = await fetchJson('api/update/log', { cache: 'no-store' });
            if (!r.ok) {
                el.logView.textContent = '无法获取日志（HTTP ' + r.status + '）。\nAgent 未连接或未配置反代。';
                el.logMeta.textContent = 'GET api/update/log · 失败';
                return null;
            }
            var body = r.body || {};
            var text = '';
            if (typeof body === 'string') {
                text = body;
            } else if (body.raw) {
                text = body.raw;
            } else if (body.log != null) {
                text = typeof body.log === 'string' ? body.log : JSON.stringify(body.log, null, 2);
            } else if (Array.isArray(body.lines)) {
                text = body.lines.join('\n');
            } else if (Array.isArray(body)) {
                text = body.join('\n');
            } else {
                text = JSON.stringify(body, null, 2);
            }
            el.logView.textContent = text.trim() ? text : '（日志为空）';
            try {
                el.logView.scrollTop = el.logView.scrollHeight;
            } catch (e) { /* ignore */ }

            var running = !!body.running;
            var exitCode = body.exitCode;
            var finishedAt = body.finishedAt;
            var metaParts = ['GET api/update/log', new Date().toLocaleTimeString()];
            if (running) {
                metaParts.push('运行中');
                setBadge('busy', '更新中');
                el.btnUpdate.disabled = true;
                startPoll();
            } else {
                el.btnUpdate.disabled = false;
                if (exitCode != null) metaParts.push('exitCode=' + exitCode);
                if (finishedAt) metaParts.push(formatTime(finishedAt));
                if (lastRunning && !running) {
                    if (exitCode === 0) {
                        setHint(el.actionHint, '更新完成（exitCode=0），已刷新版本', 'ok');
                        setBadge('ok', '已是最新');
                    } else if (exitCode != null) {
                        setHint(el.actionHint, '更新结束但失败（exitCode=' + exitCode + '）', 'err');
                        setBadge('fail', '失败');
                    }
                }
            }
            lastRunning = running;
            el.logMeta.textContent = metaParts.join(' · ');
            return { running: running, exitCode: exitCode, finishedAt: finishedAt };
        } catch (e) {
            el.logView.textContent = '无法获取日志：' + (e.message || e) + '\nAgent 未连接或未配置反代。';
            el.logMeta.textContent = 'GET api/update/log · 失败';
            return null;
        }
    }

    async function doUpdate() {
        var token = (el.tokenInput.value || '').trim();
        if (!token) {
            setHint(el.actionHint, '请先填写 Update Token', 'err');
            el.tokenInput.focus();
            return;
        }
        if (el.rememberToken.checked) {
            try {
                sessionStorage.setItem(TOKEN_KEY, token);
            } catch (e) { /* ignore */ }
        } else {
            try {
                sessionStorage.removeItem(TOKEN_KEY);
            } catch (e) { /* ignore */ }
        }

        el.btnUpdate.disabled = true;
        el.btnCheck.disabled = true;
        setBadge('busy', '更新中');
        setHint(el.actionHint, '正在触发更新…');
        setHint(el.statusHint, '更新请求已发送，日志将自动刷新。');

        try {
            var r = await fetchJson('api/update', {
                method: 'POST',
                headers: {
                    'X-Update-Token': token,
                    Accept: 'application/json'
                },
                cache: 'no-store'
            });
            if (!r.ok) {
                var errMsg = pick(r.body || {}, ['message', 'error', 'msg'], '') || 'HTTP ' + r.status;
                if (r.status === 401 || r.status === 403) errMsg = 'Token 无效或无权限（' + r.status + '）';
                if (r.status === 409) errMsg = '更新正在进行中，请稍候查看日志';
                setBadge('fail', '失败');
                setHint(el.actionHint, '更新失败：' + errMsg, 'err');
                setHint(el.statusHint, '更新失败：' + errMsg, 'err');
                el.btnUpdate.disabled = false;
            } else {
                var okMsg = pick(r.body || {}, ['message', 'msg'], '') || '更新已触发';
                setHint(el.actionHint, okMsg + '，正在拉取日志…', 'ok');
                lastRunning = true;
                startPoll();
            }
            await loadLog();
        } catch (e) {
            setBadge('fail', '失败');
            setHint(el.actionHint, '更新请求失败：' + (e.message || e), 'err');
            setHint(el.statusHint, 'Agent 未连接或未配置反代', 'warn');
            el.btnUpdate.disabled = false;
        } finally {
            el.btnCheck.disabled = false;
        }
    }

    function restoreToken() {
        try {
            var saved = sessionStorage.getItem(TOKEN_KEY);
            if (saved) {
                el.tokenInput.value = saved;
                el.rememberToken.checked = true;
            }
        } catch (e) { /* ignore */ }
    }

    el.btnCheck.addEventListener('click', function () {
        loadVersion().then(function () {
            return loadStatus(true);
        });
    });
    el.btnUpdate.addEventListener('click', doUpdate);
    el.btnLog.addEventListener('click', loadLog);

    el.rememberToken.addEventListener('change', function () {
        if (!el.rememberToken.checked) {
            try {
                sessionStorage.removeItem(TOKEN_KEY);
            } catch (e) { /* ignore */ }
        } else if (el.tokenInput.value) {
            try {
                sessionStorage.setItem(TOKEN_KEY, el.tokenInput.value);
            } catch (e) { /* ignore */ }
        }
    });

    // 初始加载
    restoreToken();
    Promise.all([loadVersion(), loadStatus(false), loadLog()]);
})();
</script>
</body>
</html>
