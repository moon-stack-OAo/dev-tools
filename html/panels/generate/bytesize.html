<div class="tool-panel" id="panel-bytesize">
    <div class="mb-8">
        <div class="label">输入</div>
        <div class="flex gap-6" style="align-items:flex-end;flex-wrap:wrap">
            <div class="flex-1" style="min-width:160px">
                <div class="label">数值</div>
                <input id="bsInput" oninput="bytesizeRender()" placeholder="1024" type="text">
            </div>
            <div style="width:120px">
                <div class="label">单位</div>
                <select id="bsUnit" onchange="bytesizeRender()" style="width:100%">
                    <option value="B">B</option>
                    <option value="KiB">KiB</option>
                    <option value="MiB">MiB</option>
                    <option selected value="GiB">GiB</option>
                    <option value="TiB">TiB</option>
                    <option value="PiB">PiB</option>
                </select>
            </div>
            <div style="width:140px">
                <div class="label">进制</div>
                <select id="bsBase" onchange="bytesizeOnBaseChange()" style="width:100%">
                    <option selected value="1024">1024 (IEC)</option>
                    <option value="1000">1000 (SI)</option>
                </select>
            </div>
            <button class="outline" onclick="bytesizeClear()" style="margin-left:auto">清空</button>
        </div>
    </div>

    <div class="toolbar">
        <button onclick="bytesizeRender()">换算</button>
        <button class="outline" onclick="bytesizeLoadExample()">加载示例 (1.5 GiB)</button>
    </div>

    <div class="copy-wrap">
        <div class="label">换算结果</div>
        <button class="copy-btn" onclick="copyText('bsResultText')">复制</button>
        <div class="output-box" id="bsResult" style="min-height:100px">
            <span style="color:var(--text-dim)">请输入数值</span>
        </div>
        <div id="bsResultText" style="display:none"></div>
    </div>

    <div style="margin-top:12px;color:var(--text-dim);font-size:12px;line-height:1.6">
        <div><b>说明</b></div>
        <div>· <b>1000 (SI)</b>：KB / MB / GB / TB / PB（1 KB = 1000 B，磁盘/网络常用）</div>
        <div>· <b>1024 (IEC)</b>：KiB / MiB / GiB / TiB / PiB（1 KiB = 1024 B，内存/OS 常用）</div>
        <div>· 切换进制后单位选项会同步更新，并重新换算全部单位</div>
    </div>
</div>
