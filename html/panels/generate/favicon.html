<div class="tool-panel" id="panel-favicon">
    <div class="mb-8">
        <div class="label">上传源图</div>
        <div class="fvi-drop" id="fviDrop">
            <input type="file" id="fviFile" accept="image/*" style="display:none">
            <div class="fvi-drop-inner">
                <img id="fviSourcePreview" class="fvi-source-img" alt="" style="display:none">
                <div class="fvi-drop-text">点击或拖拽图片到此处（PNG / JPG / SVG 等）</div>
                <div class="fvi-file-name" id="fviFileName">未选择文件</div>
            </div>
        </div>
    </div>

    <div class="mb-8">
        <div class="label">导出尺寸（px）</div>
        <div class="fvi-sizes" id="fviSizes">
            <label class="fvi-check"><input type="checkbox" data-size="16" checked> 16</label>
            <label class="fvi-check"><input type="checkbox" data-size="32" checked> 32</label>
            <label class="fvi-check"><input type="checkbox" data-size="48" checked> 48</label>
            <label class="fvi-check"><input type="checkbox" data-size="64"> 64</label>
            <label class="fvi-check"><input type="checkbox" data-size="180" checked> 180 (Apple)</label>
            <label class="fvi-check"><input type="checkbox" data-size="192" checked> 192</label>
            <label class="fvi-check"><input type="checkbox" data-size="512" checked> 512</label>
        </div>
    </div>

    <div class="toolbar">
        <button onclick="faviconGenerate()">生成</button>
        <button class="outline" onclick="faviconDownloadAll()">全部下载 PNG</button>
        <button class="outline" onclick="faviconCopyHtml()">复制 HTML</button>
        <button class="outline" onclick="faviconClear()">清空</button>
    </div>

    <div class="mb-8">
        <div class="label">预览 / 单尺寸下载</div>
        <div class="fvi-grid" id="fviGrid"><span style="color:var(--text-dim)">上传图片后生成预览</span></div>
    </div>

    <div class="copy-wrap">
        <div class="label">HTML link 片段</div>
        <button class="copy-btn" onclick="faviconCopyHtml()">复制</button>
        <textarea id="fviHtml" rows="6" readonly placeholder="生成后显示 link 标签…"></textarea>
    </div>

    <div class="fvi-hint">
        <div><b>说明</b></div>
        <div>· 导出多尺寸 PNG 作为 Favicon / PWA 图标；真正的多帧 .ico 可用在线转换或 ImageMagick 合并</div>
        <div>· 建议源图为正方形、至少 512×512</div>
    </div>
</div>
