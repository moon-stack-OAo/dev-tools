<div class="tool-panel" id="panel-semver">
    <div class="toolbar" style="flex-wrap:wrap">
        <button onclick="semverParseUi()">解析</button>
        <button class="outline" onclick="semverCompareUi()">比较</button>
        <button class="outline" onclick="semverSortUi()">排序</button>
        <button class="outline" onclick="semverSatisfiesUi()">范围检查</button>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-dim)">
            <input id="semverSortDesc" style="accent-color:var(--accent)" type="checkbox"> 降序
        </label>
        <button class="outline" onclick="semverLoadSample()">示例</button>
        <button class="outline" onclick="semverClear()">清空</button>
    </div>

    <div class="mb-8">
        <div class="label">解析版本</div>
        <input id="semverInput" placeholder="1.2.3-beta.1+build.5" style="width:100%" type="text">
    </div>

    <div class="mb-8 flex gap-6" style="flex-wrap:wrap">
        <div class="flex-1" style="min-width:140px">
            <div class="label">比较 A</div>
            <input id="semverA" placeholder="1.2.3" style="width:100%" type="text">
        </div>
        <div class="flex-1" style="min-width:140px">
            <div class="label">比较 B</div>
            <input id="semverB" placeholder="1.10.0" style="width:100%" type="text">
        </div>
    </div>

    <div class="mb-8">
        <div class="label">排序列表（每行一个版本）</div>
        <textarea class="api-body-input" id="semverList" placeholder="1.0.0&#10;1.10.0&#10;2.0.0-alpha.1" style="min-height:100px"></textarea>
    </div>

    <div class="mb-8 flex gap-6" style="flex-wrap:wrap">
        <div class="flex-1" style="min-width:140px">
            <div class="label">检查版本</div>
            <input id="semverCheckVer" placeholder="1.2.5" style="width:100%" type="text">
        </div>
        <div class="flex-1" style="min-width:180px">
            <div class="label">范围（^ ~ >= &lt; 1.2.x 等）</div>
            <input id="semverCheckRange" placeholder="^1.2.3 或 >=1.0.0 &lt;2.0.0" style="width:100%" type="text">
        </div>
    </div>

    <div class="copy-wrap">
        <div class="label">结果</div>
        <button class="copy-btn" onclick="copyText('semverOutput')">复制</button>
        <div class="output-box" id="semverOutput" style="min-height:120px">解析 / 比较 / 排序 / 范围检查结果</div>
    </div>

    <div style="margin-top:12px;padding:12px;background:var(--glass);border-radius:6px;font-size:12px;color:var(--text-dim)">
        <strong>说明：</strong>
        <ul style="margin:4px 0 0 16px">
            <li>支持 pre-release / build：1.2.3-beta.1+build.5</li>
            <li>比较返回 cmp -1 / 0 / 1；排序默认升序</li>
            <li>范围：^1.2.3、~1.2.3、&gt;=1.0.0 &lt;2.0.0、1.2.x、精确版本；|| 表示 OR</li>
        </ul>
    </div>
</div>
