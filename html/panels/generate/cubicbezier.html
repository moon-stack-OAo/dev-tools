<div class="tool-panel" id="panel-cubicbezier">
    <div class="cbz-layout">
        <div class="cbz-controls">
            <div class="mb-8">
                <div class="label">预设</div>
                <select id="cbzPreset" onchange="cubicbezierOnPresetChange()" style="width:100%;max-width:240px">
                    <option value="ease" selected>ease</option>
                    <option value="ease-in">ease-in</option>
                    <option value="ease-out">ease-out</option>
                    <option value="ease-in-out">ease-in-out</option>
                    <option value="linear">linear</option>
                    <option value="custom">自定义</option>
                </select>
            </div>

            <div class="cbz-fields">
                <div>
                    <div class="label">x1 (0~1)</div>
                    <input id="cbzX1" type="number" min="0" max="1" step="0.01" value="0.25" oninput="cubicbezierOnChange()">
                </div>
                <div>
                    <div class="label">y1</div>
                    <input id="cbzY1" type="number" step="0.01" value="0.1" oninput="cubicbezierOnChange()">
                </div>
                <div>
                    <div class="label">x2 (0~1)</div>
                    <input id="cbzX2" type="number" min="0" max="1" step="0.01" value="0.25" oninput="cubicbezierOnChange()">
                </div>
                <div>
                    <div class="label">y2</div>
                    <input id="cbzY2" type="number" step="0.01" value="1" oninput="cubicbezierOnChange()">
                </div>
                <div>
                    <div class="label">时长</div>
                    <input id="cbzDuration" type="text" value="0.3s" oninput="cubicbezierOnChange()" placeholder="0.3s">
                </div>
            </div>

            <div class="toolbar">
                <button onclick="cubicbezierRender()">更新</button>
                <button class="outline" onclick="cubicbezierPlayAnim()">播放预览</button>
                <button class="outline" onclick="cubicbezierReset()">重置</button>
            </div>

            <div class="cbz-anim-wrap">
                <div class="label">动画预览</div>
                <div class="cbz-anim-track">
                    <div class="cbz-anim-box" id="cbzAnimBox"></div>
                </div>
            </div>
        </div>

        <div class="cbz-side">
            <div class="label">曲线（拖拽控制点）</div>
            <canvas id="cbzCanvas" class="cbz-canvas" width="280" height="280"></canvas>
            <div class="copy-wrap" style="margin-top:12px">
                <div class="label">CSS</div>
                <button class="copy-btn" onclick="cubicbezierCopy()">复制</button>
                <div class="output-box" id="cbzCss" style="min-height:64px;white-space:pre-wrap;word-break:break-all"></div>
                <div id="cbzCssText" style="display:none"></div>
            </div>
        </div>
    </div>
</div>
