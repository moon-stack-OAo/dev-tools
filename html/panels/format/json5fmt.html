<div class="tool-panel" id="panel-json5fmt">
    <div class="toolbar">
        <button onclick="j5DoFormat()">格式化</button>
        <button class="outline" onclick="j5ToStrict()">转标准 JSON</button>
        <button class="outline" onclick="j5Minify()">压缩</button>
        <label style="margin-left:8px">缩进
            <select id="j5Indent" style="width:70px">
                <option value="2" selected>2</option>
                <option value="4">4</option>
            </select>
        </label>
        <label><input checked id="j5Pretty" style="accent-color:var(--accent)" type="checkbox"> 美化输出</label>
        <button class="outline" onclick="j5LoadSample()" style="margin-left:auto" type="button">示例</button>
        <button class="outline" onclick="j5Clear()" type="button">清空</button>
    </div>
    <div class="fmt-split">
        <div class="fmt-pane">
            <div class="label">输入 JSON5 / JSONC</div>
            <textarea class="json-input" id="j5Input"
                      placeholder="{&#10;  // comment&#10;  name: 'demo',&#10;  list: [1, 2,],&#10;}"></textarea>
        </div>
        <div class="fmt-pane">
            <div class="copy-wrap">
                <div class="label">输出</div>
                <button class="copy-btn" onclick="copyText('j5Output')">复制</button>
                <div class="output-box" id="j5Output"></div>
            </div>
        </div>
    </div>
</div>
