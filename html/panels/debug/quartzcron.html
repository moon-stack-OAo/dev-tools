<div class="tool-panel" id="panel-quartzcron">
    <div class="toolbar" style="flex-wrap:wrap">
        <button onclick="quartzcronParse()">解析 / 描述</button>
        <button onclick="quartzcronToSpring()">生成 @Scheduled</button>
        <button class="outline" onclick="quartzcronLoadSample()">示例</button>
        <button class="outline" onclick="quartzcronClear()">清空</button>
    </div>
    <div class="flex gap-6 mb-8" style="align-items:flex-end;flex-wrap:wrap">
        <div class="flex-1" style="min-width:240px">
            <div class="label">Quartz Cron（秒 分 时 日 月 周 [年]）</div>
            <input id="qcInput" placeholder="0 0 12 * * ?" style="width:100%;font-family:var(--font)" type="text"
                   value="0 0 12 * * ?">
        </div>
        <div style="width:160px">
            <div class="label">时区 zone</div>
            <input id="qcZone" placeholder="Asia/Shanghai" style="width:100%" type="text" value="Asia/Shanghai">
        </div>
        <div style="width:140px">
            <div class="label">方法名</div>
            <input id="qcMethod" style="width:100%" type="text" value="scheduledTask">
        </div>
    </div>
    <div class="toolbar" style="flex-wrap:wrap;margin-bottom:8px">
        <button class="outline" onclick="quartzcronPreset('0 0/5 * * * ?')">每5分钟</button>
        <button class="outline" onclick="quartzcronPreset('0 0 * * * ?')">每小时</button>
        <button class="outline" onclick="quartzcronPreset('0 0 0 * * ?')">每天零点</button>
        <button class="outline" onclick="quartzcronPreset('0 0 12 * * ?')">每天中午</button>
        <button class="outline" onclick="quartzcronPreset('0 0 9 ? * MON-FRI')">工作日 9:00</button>
        <button class="outline" onclick="quartzcronPreset('0 0 0 1 * ?')">每月1号</button>
        <button class="outline" onclick="quartzcronPreset('0 0 0 L * ?')">每月最后一天</button>
    </div>
    <div class="flex gap-6 mb-8" style="flex-wrap:wrap;align-items:flex-end">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim)">
            @Scheduled 模式
            <select id="qcMode" style="width:120px">
                <option value="cron">cron</option>
                <option value="fixedRate">fixedRate</option>
                <option value="fixedDelay">fixedDelay</option>
            </select>
        </label>
        <div style="width:120px">
            <div class="label">fixedRate (ms)</div>
            <input id="qcFixedRate" placeholder="5000" style="width:100%" type="text">
        </div>
        <div style="width:120px">
            <div class="label">fixedDelay (ms)</div>
            <input id="qcFixedDelay" placeholder="5000" style="width:100%" type="text">
        </div>
        <div style="width:120px">
            <div class="label">initialDelay</div>
            <input id="qcInitialDelay" placeholder="0" style="width:100%" type="text">
        </div>
    </div>
    <div id="qcDesc" style="padding:8px 12px;font-size:13px;color:var(--text-dim);margin-bottom:8px"></div>
    <div class="copy-wrap mb-8">
        <div class="label">解析结果 / 差异说明</div>
        <button class="copy-btn" onclick="copyText('qcOutput')">复制</button>
        <div class="output-box" id="qcOutput" style="min-height:140px"></div>
    </div>
    <div class="copy-wrap">
        <div class="label">Spring @Scheduled 代码</div>
        <button class="copy-btn" onclick="copyText('qcSpringOut')">复制</button>
        <div class="output-box" id="qcSpringOut" style="min-height:120px"></div>
    </div>
    <div style="margin-top:12px;padding:12px;background:var(--glass);border-radius:6px;font-size:12px;color:var(--text-dim)">
        <strong>提示：</strong>项目已有「Cron 表达式」工具侧重下次执行时间；本工具侧重 Quartz 语义（? L W #）、与 Unix 5
        段差异，以及 Spring <code>@Scheduled</code> 片段生成。
    </div>
</div>
