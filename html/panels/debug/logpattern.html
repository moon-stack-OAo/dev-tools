<div class="tool-panel" id="panel-logpattern">
    <div class="lp-layout">
        <div class="lp-left">
            <section class="lp-card">
                <div class="lp-card-head">
                    <i class="bi bi-braces"></i>
                    <span>Pattern 输入</span>
                </div>
                <div class="lp-templates" id="logpatternTemplates"></div>
                <label class="label" for="logpatternInput">Pattern 字符串（Logback / Log4j）</label>
                <textarea class="json-input lp-input" id="logpatternInput"
                          placeholder="%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"></textarea>
                <div class="toolbar lp-actions">
                    <button onclick="logpatternParse()" type="button"><i class="bi bi-play-fill"></i> 解析</button>
                    <button class="outline" onclick="logpatternLoadSample()" type="button">示例</button>
                    <button class="outline" onclick="logpatternClear()" type="button">清空</button>
                </div>
            </section>

            <section class="lp-card lp-words-card">
                <div class="lp-card-head">
                    <i class="bi bi-book"></i>
                    <span>Conversion Word 速查</span>
                    <span class="lp-words-count" id="logpatternWordsCount"></span>
                </div>
                <div class="lp-words-wrap" id="logpatternWords"></div>
            </section>
        </div>

        <div class="lp-right">
            <section class="lp-card lp-result">
                <div class="lp-card-head">
                    <i class="bi bi-list-check"></i>
                    <span>解析结果</span>
                    <button class="copy-btn lp-copy" id="lpCopyBtn" onclick="logpatternCopy()" type="button" style="display:none">复制</button>
                </div>
                <div id="logpatternOutput" class="lp-output">
                    <div class="lp-empty">
                        <i class="bi bi-file-earmark-code"></i>
                        <p>输入 Pattern 后点击「解析」</p>
                        <span>将拆解 conversion word、修饰符与字面量</span>
                    </div>
                </div>
                <div id="logpatternResultText" class="lp-result-text" hidden></div>
            </section>

            <section class="lp-card lp-notes">
                <div class="lp-card-head">
                    <i class="bi bi-info-circle"></i>
                    <span>说明</span>
                </div>
                <ul class="lp-notes-list">
                    <li>支持修饰符如 <code>%-5level</code>、<code>%logger{36}</code>、<code>%d{...}</code></li>
                    <li>支持复合转换 <code>%highlight(...)</code>、<code>%cyan(...)</code></li>
                    <li><code>%%</code> 表示字面量百分号</li>
                </ul>
            </section>
        </div>
    </div>
</div>
