<div class="tool-panel" id="panel-logpattern">
    <div class="toolbar" style="flex-wrap:wrap">
        <button onclick="logpatternParse()">解析 Pattern</button>
        <button class="outline" onclick="logpatternLoadSample()">示例</button>
        <button class="outline" onclick="logpatternClear()">清空</button>
    </div>

    <div class="mb-8">
        <div class="label">常用模板</div>
        <div class="flex gap-6" id="logpatternTemplates" style="flex-wrap:wrap"></div>
    </div>

    <div class="mb-8">
        <div class="label">Pattern 字符串（Logback / Log4j）</div>
        <textarea class="json-input" id="logpatternInput" placeholder="%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n" style="min-height:80px"></textarea>
    </div>

    <div class="copy-wrap">
        <div class="label">解析结果</div>
        <button class="copy-btn" onclick="copyText('logpatternOutput')">复制</button>
        <div class="output-box" id="logpatternOutput" style="min-height:140px"></div>
    </div>

    <div style="margin-top:16px">
        <div class="label">Conversion Word 速查</div>
        <div id="logpatternWords" style="max-height:320px;overflow:auto;margin-top:6px"></div>
    </div>

    <div style="margin-top:12px;padding:12px;background:var(--glass);border-radius:6px;font-size:12px;color:var(--text-dim)">
        <strong>说明：</strong>
        <ul style="margin:4px 0 0 16px">
            <li>支持修饰符如 <code>%-5level</code>、<code>%logger{36}</code>、<code>%d{...}</code></li>
            <li>支持复合转换 <code>%highlight(...)</code>、<code>%cyan(...)</code></li>
            <li><code>%%</code> 表示字面量百分号</li>
        </ul>
    </div>
</div>
