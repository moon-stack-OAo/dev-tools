<div class="tool-panel" id="panel-mqtt">
    <div class="mqtt-topbar">
        <div class="mqtt-conn-summary" id="mqttConnSummary" title="">未配置连接</div>
        <button onclick="mqttConnect()" type="button">连接</button>
        <button class="danger" onclick="mqttDisconnect()" type="button">断开</button>
        <span class="ws-status disconnected" id="mqttStatus"><span class="ws-dot"></span> 未连接</span>
        <span class="mqtt-stats" id="mqttStats"></span>
        <button class="outline" id="mqttSettingsToggle" onclick="mqttToggleSettings()" type="button">连接设置 ▾</button>
    </div>

    <div class="mqtt-settings is-collapsed">
        <div class="mqtt-preset-row">
            <span class="mqtt-preset-label">预设</span>
            <select class="mqtt-preset-select" id="mqttPresetSelect" title="连接预设">
                <option value="">选择预设…</option>
            </select>
            <div class="mqtt-preset-actions">
                <button class="outline" onclick="mqttApplyPreset()" type="button">应用</button>
                <button class="outline" onclick="mqttSavePreset()" type="button">保存</button>
                <button class="outline" onclick="mqttSavePresetAs()" type="button">另存为</button>
                <button class="outline danger" onclick="mqttDeletePreset()" type="button">删除</button>
            </div>
        </div>

        <div class="tab-bar mqtt-settings-tabs" role="tablist">
            <div class="tab active" data-mqtt-tab="basic" onclick="mqttSwitchSettingsTab('basic')" role="tab" aria-selected="true">基础</div>
            <div class="tab" data-mqtt-tab="advanced" onclick="mqttSwitchSettingsTab('advanced')" role="tab" aria-selected="false">高级</div>
        </div>

        <div class="tab-content mqtt-tab-panel active" id="mqttTabBasic" data-mqtt-tab-panel="basic" role="tabpanel">
            <div class="mqtt-form">
                <div class="mqtt-field">
                    <label class="mqtt-field-label" for="mqttConnName"><span class="mqtt-req">*</span>名称</label>
                    <input class="mqtt-field-control" id="mqttConnName" placeholder="连接名称" type="text" value="">
                </div>
                <div class="mqtt-field">
                    <label class="mqtt-field-label" for="mqttClientId"><span class="mqtt-req">*</span>Client ID</label>
                    <div class="mqtt-field-inline">
                        <input class="mqtt-field-control" id="mqttClientId" placeholder="Client ID" type="text">
                        <button class="outline" onclick="mqttRandomClientId()" title="随机 Client ID" type="button">
                            随机
                        </button>
                    </div>
                </div>
                <div class="mqtt-field">
                    <label class="mqtt-field-label" for="mqttHost"><span class="mqtt-req">*</span>服务器地址</label>
                    <div class="mqtt-field-inline mqtt-host-row">
                        <select class="mqtt-scheme" id="mqttScheme" onchange="mqttOnBrokerPartsChange()"
                                title="浏览器仅支持 WebSocket">
                            <option value="ws:" selected>ws://</option>
                            <option value="wss:">wss://</option>
                        </select>
                        <input class="mqtt-field-control" id="mqttHost" oninput="mqttOnBrokerPartsChange()"
                               placeholder="192.168.1.1 或 broker.example.com" type="text">
                    </div>
                </div>
                <div class="mqtt-field">
                    <label class="mqtt-field-label" for="mqttPort"><span class="mqtt-req">*</span>端口</label>
                    <input class="mqtt-field-control" id="mqttPort" min="1" max="65535"
                           oninput="mqttOnBrokerPartsChange()" type="number" value="8083">
                </div>
                <div class="mqtt-field">
                    <label class="mqtt-field-label" for="mqttPath">路径</label>
                    <input class="mqtt-field-control" id="mqttPath" oninput="mqttOnBrokerPartsChange()"
                           placeholder="/mqtt" type="text" value="/mqtt">
                </div>
                <div class="mqtt-field">
                    <label class="mqtt-field-label" for="mqttUsername">用户名</label>
                    <input class="mqtt-field-control" id="mqttUsername" placeholder="可选" type="text">
                </div>
                <div class="mqtt-field">
                    <label class="mqtt-field-label" for="mqttPassword">密码</label>
                    <input class="mqtt-field-control" id="mqttPassword" placeholder="可选" type="password">
                </div>
                <div class="mqtt-field mqtt-field-hint">
                    <label class="mqtt-field-label"></label>
                    <div class="mqtt-url-preview">连接 URL：<code id="mqttUrlPreview">ws://host:8083/mqtt</code></div>
                </div>
            </div>
        </div>

        <div class="tab-content mqtt-tab-panel" id="mqttTabAdvanced" data-mqtt-tab-panel="advanced" role="tabpanel" hidden>
            <div class="mqtt-form mqtt-form-advanced">
                <div class="mqtt-field">
                    <label class="mqtt-field-label" for="mqttProtocol">MQTT 版本</label>
                    <select class="mqtt-field-control" id="mqttProtocol">
                        <option value="4">MQTT 3.1.1</option>
                        <option value="5" selected>MQTT 5.0</option>
                    </select>
                </div>
                <div class="mqtt-field">
                    <label class="mqtt-field-label" for="mqttKeepAlive">Keep Alive</label>
                    <div class="mqtt-field-inline">
                        <input class="mqtt-field-control" id="mqttKeepAlive" min="0" type="number" value="60">
                        <span class="mqtt-unit">s</span>
                    </div>
                </div>
                <div class="mqtt-field">
                    <label class="mqtt-field-label" for="mqttConnectTimeout">连接超时</label>
                    <div class="mqtt-field-inline">
                        <input class="mqtt-field-control" id="mqttConnectTimeout" min="1" type="number" value="30">
                        <span class="mqtt-unit">s</span>
                    </div>
                </div>
                <div class="mqtt-field">
                    <label class="mqtt-field-label">Clean Session</label>
                    <label class="mqtt-switch">
                        <input checked id="mqttClean" type="checkbox">
                        <span class="mqtt-switch-ui"></span>
                    </label>
                </div>
            </div>
            <div class="mqtt-lwt">
                <label class="mqtt-opt-check">
                    <input id="mqttWillEnabled" type="checkbox">
                    <span>启用 LWT</span>
                </label>
                <label class="mqtt-opt">
                    <span>LWT Topic</span>
                    <input id="mqttWillTopic" placeholder="遗嘱主题" type="text">
                </label>
                <label class="mqtt-opt">
                    <span>Payload</span>
                    <input id="mqttWillPayload" placeholder="遗嘱内容" type="text">
                </label>
                <label class="mqtt-opt">
                    <span>QoS</span>
                    <select id="mqttWillQos">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                </label>
                <label class="mqtt-opt-check">
                    <input id="mqttWillRetain" type="checkbox">
                    <span>Retain</span>
                </label>
            </div>
        </div>
        <input id="mqttUrl" type="hidden" value="">
    </div>

    <div class="mqtt-workspace">
        <div class="mqtt-sidebar">
            <div class="mqtt-section-title">
                <span>订阅</span>
                <span class="mqtt-sub-count" id="mqttSubCount">0 个订阅</span>
                <button class="outline" onclick="mqttUnsubscribeAll()" type="button">全部取消</button>
                <button onclick="mqttOpenSubModal()" type="button">+ 订阅</button>
            </div>
            <div class="mqtt-sub-list" id="mqttSubList">
                <div class="mqtt-sub-empty">暂无订阅</div>
            </div>
        </div>

        <div class="mqtt-main">
            <div class="mqtt-log-head">
                <div class="mqtt-section-title">
                    <span>消息日志</span>
                    <span class="mqtt-filter-label" id="mqttFilterLabel">全部</span>
                </div>
                <div class="mqtt-log-actions">
                    <select id="mqttDirFilter" onchange="mqttOnDirFilterChange()" title="方向过滤">
                        <option value="all">全部方向</option>
                        <option value="in">仅收</option>
                        <option value="out">仅发</option>
                    </select>
                    <input id="mqttKwFilter" placeholder="关键字" type="text">
                    <button class="outline" onclick="mqttClearLog()" type="button">清空</button>
                    <button class="copy-btn" onclick="mqttCopyLog()" type="button">复制</button>
                    <button class="outline" onclick="mqttExportLog()" type="button">导出</button>
                </div>
            </div>
            <div class="mqtt-log" id="mqttLog">
                <div class="mqtt-log-empty">等待连接…</div>
            </div>
        </div>
    </div>

    <div class="mqtt-composer">
        <div class="mqtt-row mqtt-composer-meta">
            <input id="mqttPubTopic" placeholder="发布主题（不可含 + / #）" type="text">
            <select id="mqttPubQos">
                <option value="0">QoS 0</option>
                <option value="1">QoS 1</option>
                <option value="2">QoS 2</option>
            </select>
            <select id="mqttPubFormat" onchange="mqttOnPubFormatChange()" title="Payload 编码">
                <option value="text" selected>Text</option>
                <option value="json">JSON</option>
                <option value="hex">Hex</option>
                <option value="base64">Base64</option>
            </select>
            <label class="mqtt-opt-check">
                <input id="mqttPubRetain" type="checkbox">
                <span>Retain</span>
            </label>
            <button onclick="mqttPublish()" type="button">发布</button>
        </div>
        <textarea class="json-input mqtt-payload" id="mqttPubPayload" placeholder="Payload 文本" rows="3"></textarea>
    </div>

    <div class="mqtt-hint">
        <strong>说明：</strong>
        仅支持 MQTT over WebSocket（<code>ws://</code> / <code>wss://</code>）；勿使用 <code>tcp://</code> 或
        <code>mqtt://</code> 直连 1883。
        跨域与混合内容（HTTPS 页访问 ws://）可能导致连接失败。
        预设含密码，仅存本机。
    </div>

    <div class="mqtt-modal-backdrop" id="mqttSubModal" hidden>
        <div class="mqtt-modal" role="dialog" aria-labelledby="mqttSubModalTitle" aria-modal="true">
            <div class="mqtt-modal-header">
                <span id="mqttSubModalTitle">添加订阅</span>
                <button class="outline" onclick="mqttCloseSubModal()" title="关闭" type="button">关闭</button>
            </div>
            <div class="mqtt-modal-body">
                <div class="mqtt-tip">每行一个主题，也可用逗号 / 分号分隔。通配符：<code>+</code> 单层，<code>#</code>
                    多层（须在末尾）。
                </div>
                <textarea class="json-input mqtt-sub-textarea" id="mqttSubTopic"
                          placeholder="sensor/+/temp&#10;device/#&#10;home/living/temp" rows="8"></textarea>
                <label class="mqtt-opt">
                    <span>QoS</span>
                    <select id="mqttSubQos">
                        <option value="0">QoS 0</option>
                        <option value="1">QoS 1</option>
                        <option value="2">QoS 2</option>
                    </select>
                </label>
            </div>
            <div class="mqtt-modal-footer">
                <button class="outline" onclick="mqttCloseSubModal()" type="button">取消</button>
                <button onclick="mqttSubscribe()" type="button">订阅</button>
            </div>
        </div>
    </div>
</div>
