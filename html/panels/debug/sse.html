<div class="tool-panel" id="panel-sse">
    <div class="sse-topbar">
        <input id="sseUrl" placeholder="https://api.example.com/events" type="text" value="">
        <button onclick="sseConnect()">连接</button>
        <button class="danger" onclick="sseDisconnect()">断开</button>
        <button class="outline" onclick="sseClear()">清空</button>
        <span class="ws-status disconnected" id="sseStatus"><span class="ws-dot"></span> 未连接</span>
    </div>

    <div class="sse-config">
        <div class="sse-config-item sse-config-headers">
            <div class="label">自定义请求头 <span class="sse-tip">JSON 对象</span></div>
            <textarea class="json-input" id="sseHeaders" placeholder='{"Authorization": "Bearer xxx"}'></textarea>
        </div>
        <div class="sse-config-item sse-config-filter">
            <div class="label">事件过滤 <span class="sse-tip">逗号分隔，空=全部</span></div>
            <textarea class="json-input" id="sseFilter"
                      placeholder="message, update, notification"></textarea>
        </div>
    </div>

    <div class="sse-log-head">
        <div class="label" style="margin:0">事件日志</div>
        <button class="copy-btn" onclick="sseCopyLog()" type="button">复制</button>
    </div>
    <div class="sse-log" id="sseLog">
        <div class="sse-log-empty">等待连接…</div>
    </div>

    <div class="sse-hint">
        <strong>说明：</strong>
        Server-Sent Events 单向实时流调试 · 支持自定义请求头与事件类型过滤 ·
        使用 fetch + stream 解析（可带 Authorization）· 显示事件类型 / ID / 时间戳 / 数据
    </div>
</div>
