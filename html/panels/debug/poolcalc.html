<div class="tool-panel" id="panel-poolcalc">
    <div class="pc-layout">
        <div class="pc-left">
            <section class="pc-card pc-inputs">
                <div class="pc-card-head">
                    <i class="bi bi-sliders"></i>
                    <span>输入参数</span>
                </div>
                <div class="pc-form-grid">
                    <div class="pc-field">
                        <label class="label" for="pcQps">QPS</label>
                        <input id="pcQps" min="0" placeholder="如 200" step="any" type="number">
                        <span class="pc-hint">目标吞吐量</span>
                    </div>
                    <div class="pc-field">
                        <label class="label" for="pcAvgMs">平均耗时 (ms)</label>
                        <input id="pcAvgMs" min="0" placeholder="如 50" step="any" type="number">
                        <span class="pc-hint">单请求平均 RT</span>
                    </div>
                    <div class="pc-field">
                        <label class="label" for="pcCores">CPU 核数</label>
                        <input id="pcCores" min="1" step="1" type="number" value="8">
                        <span class="pc-hint">机器可用核数</span>
                    </div>
                    <div class="pc-field">
                        <label class="label" for="pcBlock">阻塞比 (wait/compute)</label>
                        <input id="pcBlock" min="0" placeholder="CPU≈0 · IO≥1" step="any" type="number" value="1">
                        <span class="pc-hint">CPU 密集 0~0.5 · IO 可 5+</span>
                    </div>
                    <div class="pc-field">
                        <label class="label" for="pcUtil">目标利用率 (0~1)</label>
                        <input id="pcUtil" max="1" min="0" step="0.05" type="number" value="0.7">
                        <span class="pc-hint">建议 0.6 ~ 0.8</span>
                    </div>
                    <div class="pc-field">
                        <label class="label" for="pcQueueSec">可接受排队 (秒)</label>
                        <input id="pcQueueSec" min="0" step="0.1" type="number" value="1.5">
                        <span class="pc-hint">队列缓冲时间</span>
                    </div>
                </div>
                <div class="toolbar pc-actions">
                    <button onclick="poolcalcEstimate()" type="button"><i class="bi bi-calculator"></i> 估算</button>
                    <button class="outline" onclick="poolcalcSample()" type="button">示例 (IO 密集)</button>
                    <button class="outline" onclick="poolcalcClear()" type="button">清空</button>
                </div>
            </section>

            <section class="pc-card pc-notes">
                <div class="pc-card-head">
                    <i class="bi bi-info-circle"></i>
                    <span>说明</span>
                </div>
                <ul class="pc-notes-list">
                    <li>理论并发 ≈ <code>QPS × 平均耗时(秒)</code>（Little's Law）</li>
                    <li>阻塞比：CPU 密集填 <code>0~0.5</code>；纯 IO 可填 <code>5~10+</code></li>
                    <li>结果仅供参考，请结合压测、超时与拒绝策略微调</li>
                </ul>
            </section>
        </div>

        <section class="pc-card pc-result">
            <div class="pc-card-head">
                <i class="bi bi-speedometer2"></i>
                <span>估算结果</span>
                <button class="copy-btn pc-copy" id="pcCopyBtn" onclick="poolcalcCopy()" type="button" style="display:none">复制</button>
            </div>
            <div id="pcOutput" class="pc-output">
                <div class="pc-empty">
                    <i class="bi bi-cpu"></i>
                    <p>填写参数后点击「估算」</p>
                    <span>基于 Little's Law 与 CPU/IO 模型给出 core / max / queue 建议</span>
                </div>
            </div>
            <div id="pcResultText" class="pc-result-text" hidden></div>
        </section>
    </div>
</div>
