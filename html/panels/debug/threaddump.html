<div class="tool-panel" id="panel-threaddump">
    <div class="toolbar" style="flex-wrap:wrap">
        <button onclick="threaddumpAnalyze()">分析</button>
        <button class="outline" onclick="threaddumpLoadSample()">示例</button>
        <button class="outline" onclick="threaddumpClear()">清空</button>
    </div>
    <div class="mb-8">
        <div class="label">线程 Dump（jstack / Thread.dumpStack）</div>
        <textarea class="json-input" id="threaddumpInput"
                  placeholder='粘贴 jstack 输出，例如：&#10;"main" #1 prio=5 tid=0x... nid=0x... runnable'></textarea>
    </div>
    <div class="copy-wrap">
        <div class="label">分析结果</div>
        <button class="copy-btn" onclick="copyText('threaddumpOutput')">复制</button>
        <div class="output-box" id="threaddumpOutput" style="min-height:200px">点击「分析」查看状态统计、线程列表与死锁提示</div>
    </div>
    <div style="margin-top:12px;padding:12px;background:var(--glass);border-radius:6px;font-size:12px;color:var(--text-dim)">
        <strong>说明：</strong>
        <ul style="margin:4px 0 0 16px">
            <li>解析线程名、状态、prio、tid/nid、daemon</li>
            <li>统计 RUNNABLE / WAITING / BLOCKED / TIMED_WAITING 等</li>
            <li>识别 “Found one Java-level deadlock” 段落，并启发式检测 waiting/locked 交叉</li>
        </ul>
    </div>
</div>
