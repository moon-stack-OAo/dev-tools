<div class="tool-panel" id="panel-ddlmermaid">
    <div class="toolbar dm-toolbar" style="flex-wrap:wrap">
        <button onclick="ddlmermaidGenerate()">生成 Mermaid ER</button>
        <button class="outline" onclick="ddlmermaidLoadSample()">示例</button>
        <button class="outline" onclick="ddlmermaidClear()">清空</button>
        <button class="outline" onclick="ddlmermaidOpenInEditor()" title="在 Mermaid 编辑器中打开当前输出">在 Mermaid 编辑器打开</button>
    </div>
    <div class="dm-main">
        <div class="dm-col dm-col-input">
            <div class="label">CREATE TABLE DDL（MySQL 风格）</div>
            <textarea class="json-input dm-input" id="dmInput"
                      placeholder="CREATE TABLE users (&#10;  id BIGINT PRIMARY KEY,&#10;  name VARCHAR(64)&#10;);"
                      spellcheck="false"></textarea>
            <div class="dm-hint">
                <strong>支持：</strong>
                表名 / 字段 / 类型 / PRIMARY KEY（行内·表级）·
                FOREIGN KEY 与列级 REFERENCES · 多表分号分隔 ·
                输出可粘贴到支持 Mermaid 的 Markdown 中渲染
            </div>
        </div>
        <div class="dm-col dm-col-output">
            <div class="copy-wrap dm-output-wrap">
                <div class="label">Mermaid erDiagram</div>
                <button class="copy-btn" onclick="copyText('dmOutput')">复制</button>
                <div class="output-box dm-output" id="dmOutput"></div>
            </div>
        </div>
    </div>
</div>
