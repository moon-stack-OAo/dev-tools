<div class="tool-panel" id="panel-mavencoord">
    <div class="toolbar" style="flex-wrap:wrap">
        <button onclick="mavencoordGenerate()">生成依赖片段</button>
        <button class="outline" onclick="mavencoordLoadSample()">示例</button>
        <button class="outline" onclick="mavencoordClear()">清空</button>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim)">
            Scope
            <select id="mcScope" style="width:120px">
                <option value="">(默认/compile)</option>
                <option value="compile">compile</option>
                <option value="provided">provided</option>
                <option value="runtime">runtime</option>
                <option value="test">test</option>
            </select>
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-dim)">
            <input id="mcOptional" style="accent-color:var(--accent)" type="checkbox"> optional
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-dim)">
            <input id="mcBom" style="accent-color:var(--accent)" type="checkbox"> 输出 BOM import
        </label>
    </div>
    <div class="mb-8">
        <div class="label">Maven 坐标</div>
        <textarea class="json-input" id="mcInput" placeholder="groupId:artifactId:version&#10;或&#10;groupId=com.example&#10;artifactId=demo&#10;version=1.0.0"
                  style="min-height:100px"></textarea>
    </div>
    <div class="copy-wrap">
        <div class="label">依赖片段</div>
        <button class="copy-btn" onclick="copyText('mcOutput')">复制</button>
        <div class="output-box" id="mcOutput" style="min-height:180px"></div>
    </div>
    <div style="margin-top:12px;padding:12px;background:var(--glass);border-radius:6px;font-size:12px;color:var(--text-dim)">
        <strong>支持格式：</strong>
        <ul style="margin:4px 0 0 16px">
            <li><code>g:a:v</code> / <code>g:a:packaging:v</code> / <code>g:a:packaging:classifier:v</code></li>
            <li><code>g:a:v@runtime</code> 指定 scope</li>
            <li>多行 <code>groupId=...</code> / <code>artifactId=...</code> / <code>version=...</code></li>
        </ul>
    </div>
</div>
