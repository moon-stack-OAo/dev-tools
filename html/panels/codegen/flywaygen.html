<div class="tool-panel" id="panel-flywaygen">
    <div class="toolbar fly-toolbar" style="flex-wrap:wrap">
        <button class="primary" onclick="flyGenFlyway()">生成 Flyway</button>
        <button onclick="flyGenLiquibase()">生成 Liquibase</button>
        <button class="outline" onclick="flyGenColumnSql()">列变更 SQL</button>
        <button class="outline" onclick="flyLoadSample()">示例</button>
        <button class="outline" onclick="flyClear()">清空</button>
        <label class="fly-field-inline">
            <span>Liquibase</span>
            <select id="flyLbFormat">
                <option value="yaml">YAML</option>
                <option value="xml">XML</option>
            </select>
        </label>
        <label class="fly-field-inline">
            <span>方言</span>
            <select id="flyDialect">
                <option value="mysql">MySQL</option>
                <option value="postgres">PostgreSQL</option>
                <option value="oracle">Oracle</option>
                <option value="sqlserver">SQL Server</option>
            </select>
        </label>
    </div>

    <div class="fly-main">
        <div class="fly-col fly-col-form">
            <div class="fly-card">
                <div class="fly-card-title"><i class="bi bi-tag"></i> 迁移元信息</div>
                <div class="fly-grid">
                    <div class="fly-field">
                        <div class="label">版本号</div>
                        <input id="flyVersion" placeholder="1.0.1" type="text" value="1">
                    </div>
                    <div class="fly-field fly-field-grow">
                        <div class="label">描述</div>
                        <input id="flyDesc" placeholder="add user email" type="text">
                    </div>
                    <div class="fly-field">
                        <div class="label">作者</div>
                        <input id="flyAuthor" placeholder="dev" type="text" value="dev">
                    </div>
                    <div class="fly-field fly-field-grow">
                        <div class="label">Liquibase changeset id</div>
                        <input id="flyLbId" placeholder="可选，默认时间戳" type="text">
                    </div>
                </div>
            </div>

            <div class="fly-card">
                <div class="fly-card-title"><i class="bi bi-table"></i> 列变更（可选）</div>
                <div class="fly-grid">
                    <div class="fly-field">
                        <div class="label">表名</div>
                        <input id="flyTable" placeholder="sys_user" type="text">
                    </div>
                    <div class="fly-field">
                        <div class="label">旧列（rename）</div>
                        <input id="flyOldCol" placeholder="old_col" type="text">
                    </div>
                    <div class="fly-field">
                        <div class="label">新列（add/rename）</div>
                        <input id="flyNewCol" placeholder="new_col" type="text">
                    </div>
                    <div class="fly-field">
                        <div class="label">列类型</div>
                        <input id="flyColType" placeholder="VARCHAR(64)" type="text" value="VARCHAR(64)">
                    </div>
                </div>
            </div>

            <div class="fly-card fly-card-ddl">
                <div class="fly-card-title"><i class="bi bi-code-slash"></i> DDL / SQL（可选，写入模板正文）</div>
                <textarea class="json-input fly-ddl" id="flyDdl" placeholder="ALTER TABLE ..."
                          spellcheck="false"></textarea>
            </div>

            <div class="fly-hint">
                <strong>说明</strong>
                <ul>
                    <li>Flyway：<code>V{version}__{desc}.sql</code> + SQL 头注释模板</li>
                    <li>Liquibase：YAML / XML changeset；填新旧列自动 rename / add</li>
                    <li>列变更 SQL 按方言生成，可再用于 Flyway 正文</li>
                </ul>
            </div>
        </div>

        <div class="fly-col fly-col-out">
            <div class="fly-card fly-card-out">
                <div class="fly-card-title"><i class="bi bi-file-earmark-code"></i> 文件名 / 输出标识</div>
                <div class="output-box fly-filename" id="flyFileName"></div>
            </div>
            <div class="copy-wrap fly-output-wrap">
                <div class="label">生成内容</div>
                <button class="copy-btn" onclick="copyText('flyOutput')">复制</button>
                <div class="output-box fly-output" id="flyOutput"></div>
            </div>
        </div>
    </div>
</div>
