<div class="tool-panel" id="panel-protobuf">
    <div class="toolbar pb-toolbar" style="flex-wrap:wrap">
        <button class="primary" onclick="protobufDecodeBase64()">Base64 → JSON</button>
        <button onclick="protobufDecodeHex()">Hex → JSON</button>
        <button class="outline" onclick="protobufEncode()">JSON → Base64</button>
    </div>

    <div class="pb-main">
        <div class="pb-col pb-col-in">
            <div class="pb-card">
                <div class="pb-card-title"><i class="bi bi-file-earmark-code"></i> Proto 定义（可选）</div>
                <textarea class="json-input pb-schema" id="protobufSchema" spellcheck="false"
                          placeholder="message User {
  int32 id = 1;
  string name = 2;
  string email = 3;
}"></textarea>
            </div>
            <div class="pb-card pb-card-input">
                <div class="pb-card-title"><i class="bi bi-input-cursor-text"></i> 输入数据</div>
                <textarea class="json-input pb-input" id="protobufInput" spellcheck="false"
                          placeholder="Base64 / Hex 编码的 Protobuf，或 JSON（编码时）"></textarea>
            </div>
            <div class="pb-hint">
                <strong>说明</strong>
                <ul>
                    <li>支持无 Schema 的通用解码（字段显示为 field_N）</li>
                    <li>提供 Proto 定义后，字段名称会自动映射</li>
                    <li>支持嵌套消息、packed 重复字段、map、oneof、枚举等</li>
                    <li>编码功能需要输入合法的 JSON 对象</li>
                </ul>
            </div>
        </div>
        <div class="pb-col pb-col-out">
            <div class="copy-wrap pb-output-wrap">
                <div class="label">解码 / 编码结果</div>
                <button class="copy-btn" onclick="copyText('protobufOutput')">复制</button>
                <pre class="output-box pb-output" id="protobufOutput"></pre>
            </div>
        </div>
    </div>
</div>
