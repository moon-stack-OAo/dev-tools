<div class="tool-panel" id="panel-morse">
    <div class="toolbar">
        <button onclick="morseDoEncode()">文本 → 摩斯</button>
        <button class="outline" onclick="morseDoDecode()">摩斯 → 文本</button>
        <label title="汉字经「中文电码」转四位数字后再编摩斯（大陆标准）">
            <input checked id="morseChinese" style="accent-color:var(--accent)" type="checkbox"> 中文电码
        </label>
        <label><input id="morseUnicode" style="accent-color:var(--accent)" type="checkbox"> 输出 ·−</label>
        <label><input id="morseLower" style="accent-color:var(--accent)" type="checkbox"> 解码小写</label>
        <button class="outline" onclick="morseClear()" style="margin-left:auto;color:var(--danger)">清空</button>
    </div>
    <div class="fmt-split">
        <div class="fmt-pane">
            <div class="label">输入（文本或摩斯码）</div>
            <textarea class="json-input" id="morseInput"
                      placeholder="英文：HELLO WORLD&#10;中文：中文&#10;摩斯：.... . .-.. .-.. --- / .-- --- .-. .-.. -.."></textarea>
        </div>
        <div class="fmt-pane">
            <div class="copy-wrap">
                <div class="label">输出</div>
                <button class="copy-btn" onclick="copyText('morseOutput')">复制</button>
                <div class="output-box" id="morseOutput"></div>
            </div>
        </div>
    </div>
    <div class="hint" style="margin-top:10px;color:var(--text-muted);font-size:12px;line-height:1.5">
        ITU 国际摩斯码：字母间空格，词间 <code>/</code>。
        <strong>中文</strong>无直接摩斯码，启用「中文电码」后：汉字 → 四位电报码 → 数字摩斯
        （如 <code>中</code>=0022 → <code>----- ----- ..--- ..---</code>）。
        与 ASCII 相邻时自动加软词界 <code>//</code>（解码无空格），避免电码数字与字面数字混淆（如 <code>9.9起</code>）。解码时请保持同一选项。
        中文/全角标点自动映射半角（<code>，</code>→<code>,</code>、<code>。</code>→<code>.</code> 等）。
        扩展符号（非 ITU）：<code># % * [ ] { } | &lt; &gt; ^ ` \ ~</code>。
        电码表约 7k 字（Unihan 大陆标准），按需加载。
    </div>
</div>
