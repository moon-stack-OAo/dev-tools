<div class="tool-panel" id="panel-imgbase64">
    <div class="tab-bar ib64-tabs">
        <div class="tab active" onclick="imgbase64SwitchTab('encode')">图片 → Base64</div>
        <div class="tab" onclick="imgbase64SwitchTab('decode')">Base64 → 图片</div>
    </div>

    <div class="tab-content active" id="imgbase64Tab-encode">
        <div class="ib64-main">
            <div class="ib64-col ib64-col-in">
                <div class="ib64-card">
                    <div class="ib64-card-title"><i class="bi bi-image"></i> 选择 / 拖放图片</div>
                    <input accept="image/*" class="ib64-file" id="img2b64File" multiple
                           onchange="img2b64HandleFiles(this.files)" type="file">
                    <div class="img2b64-drop" id="img2b64Drop">或将图片拖到此处（支持多选）</div>
                </div>
                <div class="ib64-card ib64-card-list">
                    <div class="ib64-card-title"><i class="bi bi-list-ul"></i> 文件列表</div>
                    <div class="img2b64-list" id="img2b64List"></div>
                </div>
            </div>
            <div class="ib64-col ib64-col-out">
                <div class="toolbar ib64-toolbar" style="flex-wrap:wrap">
                    <button class="primary" onclick="img2b64CopyDataUrl()">复制 DataURL</button>
                    <button class="outline" onclick="img2b64CopyPure()">复制纯 Base64</button>
                    <button class="outline" onclick="img2b64Download()">下载 .txt</button>
                    <button class="outline" onclick="img2b64Clear()">清空</button>
                </div>
                <div class="copy-wrap ib64-output-wrap">
                    <div class="label">当前 DataURL 输出</div>
                    <button class="copy-btn" onclick="copyText('img2b64Output')">复制</button>
                    <textarea class="output-box json-input ib64-output" id="img2b64Output" readonly
                              spellcheck="false"></textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="tab-content" id="imgbase64Tab-decode">
        <div class="ib64-main">
            <div class="ib64-col ib64-col-in">
                <div class="ib64-card ib64-card-decode">
                    <div class="ib64-card-title"><i class="bi bi-braces"></i> Base64 输入</div>
                    <textarea class="json-input ib64-decode-input" id="b642imgInput"
                              placeholder="data:image/png;base64,iVBORw0KGgo...&#10;或纯 Base64 字符串"
                              spellcheck="false"></textarea>
                    <div class="toolbar ib64-toolbar" style="flex-wrap:wrap;margin-top:10px">
                        <button class="primary" onclick="b642imgRender()">渲染</button>
                        <button class="outline" onclick="b642imgDownload()">下载图片</button>
                        <button class="outline" onclick="b642imgClear()">清空</button>
                    </div>
                </div>
            </div>
            <div class="ib64-col ib64-col-out">
                <div class="ib64-card ib64-card-preview">
                    <div class="ib64-card-title"><i class="bi bi-eye"></i> 图片预览</div>
                    <div class="b642img-preview" id="b642imgPreview"></div>
                    <div class="b642img-meta" id="b642imgMeta"></div>
                </div>
            </div>
        </div>
    </div>
</div>
