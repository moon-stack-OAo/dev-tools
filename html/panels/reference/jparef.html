<div class="tool-panel" id="panel-jparef">
    <div class="ref-search-bar">
        <div class="ref-search-input-wrap">
            <i class="bi bi-search search-icon"></i>
            <input
                id="jparefSearch"
                oninput="
                    jparefSearchInput();
                    toggleRefClear(this);
                "
                placeholder="搜索注解、JPQL、GenerationType、FetchType..."
                type="text"
            />
            <button class="ref-search-clear" onclick="clearRefSearch(this)" type="button">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>
    <div id="jparefContent"></div>
</div>
