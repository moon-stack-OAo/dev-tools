<div class="tool-panel" id="panel-k8sref">
    <div class="ref-search-bar">
        <div class="ref-search-input-wrap">
            <i class="bi bi-search search-icon"></i>
            <input
                id="k8srefSearch"
                oninput="
                    k8srefSearch();
                    toggleRefClear(this);
                "
                placeholder="搜索 kubectl 命令、资源、操作..."
                type="text"
            />
            <button class="ref-search-clear" onclick="clearRefSearch(this)" type="button">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>
    <div id="k8srefContent"></div>
</div>
