<div class="tool-panel" id="panel-flowableref">
    <div class="ref-search-bar">
        <div class="ref-search-input-wrap">
            <i class="bi bi-search search-icon"></i>
            <input
                id="flowablerefSearch"
                oninput="
                    flowablerefSearch();
                    toggleRefClear(this);
                "
                placeholder="搜索 API / BPMN / 表名 / 场景 / 示例..."
                type="text"
            />
            <button class="ref-search-clear" onclick="clearRefSearch(this)" type="button">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>
    <div id="flowablerefContent"></div>
</div>
