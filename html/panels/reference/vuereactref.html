<div class="tool-panel" id="panel-vuereactref">
    <div class="ref-search-bar">
        <div class="ref-search-input-wrap">
            <i class="bi bi-search search-icon"></i>
            <input
                id="vuereactrefSearch"
                oninput="
                    vuereactrefSearch();
                    toggleRefClear(this);
                "
                placeholder="搜索 Vue API、React Hooks、模式..."
                type="text"
            />
            <button class="ref-search-clear" onclick="clearRefSearch(this)" type="button">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>
    <div id="vuereactrefContent"></div>
</div>
