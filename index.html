<div class="app" id="app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title"><i class="bi bi-grid-3x3-gap" aria-hidden="true"></i><span>导航</span></span>
        </div>
        <div class="sidebar-quick" id="sidebarQuick" aria-label="快捷入口"></div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
            <button class="sidebar-toggle" id="sidebarToggle" title="折叠侧边栏" type="button">
                <i class="bi bi-chevron-double-left"></i>
            </button>
        </div>
        <div class="sidebar-resizer" id="sidebarResizer" title="拖动调整宽度"></div>
    </aside>
    <div class="main" id="mainContainer">
        <div class="main-header">
            <button type="button" class="sidebar-menu-btn" id="sidebarMenuBtn" title="打开分类菜单"
                    aria-label="打开分类菜单" aria-controls="sidebar" aria-expanded="false">
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>
            <div class="home-btn" id="homeBtn" onclick="goHome()" style="display:none" title="返回首页"><i
                    class="bi bi-chevron-left"></i></div>
            <div class="header-home-title" id="headerHomeTitle">
                <h1 class="hh-title"><img class="hh-logo" src="favicon.svg" width="22" height="22"
                                          alt="" aria-hidden="true"><span class="hh-title-text">CodeDeck</span></h1>
                <span class="hh-sub" id="headerHomeSub">全栈可用 · 纯前端本地处理</span>
            </div>
            <div class="breadcrumb" id="breadcrumb"></div>
            <div class="home-search-wrap">
                <span class="search-icon"><i class="bi bi-search"></i></span>
                <label for="homeSearch"></label>
                <input id="homeSearch" onblur="setTimeout(hideHomeCmdPanel,150)" onfocus="showHomeCmdPanel()"
                       oninput="onHomeSearchInput()" placeholder="搜索工具… Ctrl+K"
                       type="search" autocomplete="off" role="combobox" aria-autocomplete="list"
                       aria-controls="homeHeatmap" aria-expanded="false">
                <div class="home-heatmap home-cmd-panel" id="homeHeatmap" style="display:none" role="listbox"></div>
            </div>
            <button type="button" class="home-density-btn" id="homeDensityToggle" title="切换首页密度：舒适"
                    aria-label="切换首页密度" aria-pressed="false" data-density="comfortable">
                <i class="bi bi-grid" aria-hidden="true"></i>
            </button>
            <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题 (Ctrl+J)"><i
                    class="bi bi-moon-stars-fill" id="themeIcon"></i></div>
        </div>

        <div id="panels-loading" style="padding:60px 24px;text-align:center;color:var(--text-muted);font-size:13px">
            正在加载工具模块...
        </div>

        <div id="panels-container" style="display:none">
            <div class="tool-panel home-panel active" id="panel-home">
                <div class="home-body">
                    <div class="home-cat-anchors" id="homeCatAnchors"></div>
                    <div class="home-grid" id="homeGrid"></div>
                </div>
            </div>
            <button class="back-to-top" id="backToTop" title="返回顶部"><i class="bi bi-chevron-up"></i></button>
            <div id="toolLoadingOverlay" class="tool-loading-overlay" hidden aria-hidden="true" role="status" aria-live="polite">
                <div class="tool-loading-card">
                    <div class="tool-loading-spinner" aria-hidden="true"></div>
                    <div class="tool-loading-text" id="toolLoadingText">正在打开工具…</div>
                    <div class="tool-loading-sub" id="toolLoadingSub"></div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <span id="statusText">就绪</span>
            <span class="status-build" id="statusBuild" title="构建版本"></span>
        </div>
    </div>
</div>
