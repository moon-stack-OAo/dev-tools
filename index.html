<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

          name="keywords">
    <meta content="index,follow,max-image-preview:large" name="robots">

    <meta content="#0f172a" name="theme-color">
    <meta content="yes" name="mobile-web-app-capable">
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style">
    <meta content="CodeCasket" name="apple-mobile-web-app-title">

          property="og:description">

    <meta content="summary" name="twitter:card">
    <meta content="CodeCasket · 码匣 — 纯前端开发者工具箱" name="twitter:title">
    <meta content="150+ 本地工具：格式化、编解码、安全、代码生成与调试。数据不出浏览器。"
          name="twitter:description">
    <meta content="https://tools.livancen.top/favicon.svg" name="twitter:image">
    <!-- CSP：务实策略，兼容 jsrun(new Function)、内联 ASSET_MAP、pyodide(worker/blob/wasm)、懒加载与调试工具外连 -->
    <meta content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: http: ws: wss: blob:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
          http-equiv="Content-Security-Policy">

    <link href="favicon.svg" rel="apple-touch-icon">
    <link href="site.webmanifest" rel="manifest">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CodeCasket",
      "alternateName": ["码匣", "CodeCasket 码匣"],
      "url": "https://tools.livancen.top/",
      "description": "面向开发者的纯前端在线工具集，含 Java 深度工具。数据 100% 本地处理，无需注册、可离线。",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "CNY"
      },
      "inLanguage": ["zh-CN", "en"]
    }
    </script>
    <!-- 第三方库已改为按需懒加载,见 js/loader.js 中的 toolLibs / loadLib -->
    <link href="css/base.css" rel="stylesheet">
    <link href="css/layout.css" rel="stylesheet">
    <link href="css/format.css" rel="stylesheet">
    <link href="css/encode.css" rel="stylesheet">
    <link href="css/security.css" rel="stylesheet">
    <link href="css/generate.css" rel="stylesheet">
    <link href="css/codegen.css" rel="stylesheet">
    <link href="css/text.css" rel="stylesheet">
    <link href="css/debug.css" rel="stylesheet">
    <link href="css/reference.css" rel="stylesheet">
</head>

<body>
<div class="app" id="app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title"><i class="bi bi-grid-3x3-gap"></i> 分类</span>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
            <button class="sidebar-toggle" id="sidebarToggle" title="折叠侧边栏" type="button">
                <i class="bi bi-chevron-double-left"></i>
            </button>
        </div>
    </aside>
    <div class="main" id="mainContainer">
        <div class="main-header">
            <div class="home-btn" id="homeBtn" onclick="goHome()" style="display:none" title="返回首页"><i
                    class="bi bi-chevron-left"></i></div>
            <div class="header-home-title" id="headerHomeTitle">
                <span class="hh-title"><img class="hh-logo" src="favicon.svg" width="22" height="22"
                                            alt="" aria-hidden="true"><span class="hh-title-text">CodeCasket</span></span>
                <span class="hh-sub">158 个工具 · 8 大分类 · 全栈可用 · 纯前端本地处理</span>
            </div>
            <div class="breadcrumb" id="breadcrumb"></div>
            <div class="home-search-wrap">
                <span class="search-icon"><i class="bi bi-search"></i></span>
                <label for="homeSearch"></label>
                <input id="homeSearch" onblur="setTimeout(hideHomeHeatmap,150)" onfocus="showHomeHeatmap()"
                       oninput="onHomeSearchInput()" placeholder="搜索工具..."
                       type="search">
                <div class="home-heatmap" id="homeHeatmap" style="display:none"></div>
            </div>
            <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题 (Ctrl+J)"><i
                    class="bi bi-moon-stars-fill" id="themeIcon"></i></div>
        </div>

        <div id="panels-loading" style="padding:60px 24px;text-align:center;color:var(--text-muted);font-size:13px">
            正在加载工具模块...
        </div>

        <div id="panels-container" style="display:none">
            <div class="tool-panel home-panel active" id="panel-home">
                <div class="home-audience-bar" id="homeAudienceBar" role="tablist" aria-label="工具受众筛选">
                    <button type="button" class="home-audience-btn active" data-audience="all" onclick="setHomeAudience('all')">全部</button>
                    <button type="button" class="home-audience-btn" data-audience="common" onclick="setHomeAudience('common')">通用</button>
                    <button class="home-audience-btn" data-audience="frontend" onclick="setHomeAudience('frontend')" type="button">前端</button>
                    <button class="home-audience-btn" data-audience="backend" onclick="setHomeAudience('backend')" type="button">后端</button>
                    <button type="button" class="home-audience-btn" data-audience="java" onclick="setHomeAudience('java')">Java</button>
                </div>
                <div class="home-body">
                    <div class="home-cat-anchors" id="homeCatAnchors"></div>
                    <div class="home-grid" id="homeGrid"></div>
                </div>
            </div>
            <button class="back-to-top" id="backToTop" title="返回顶部"><i class="bi bi-chevron-up"></i></button>
            <div id="toolLoadingOverlay" class="tool-loading-overlay" hidden aria-hidden="true" role="status" aria-live="polite">
                <div class="tool-loading-card">
                    <div class="tool-loading-spinner" aria-hidden="true"></div>
                    <div class="tool-loading-text" id="toolLoadingText">正在打开工具…</div>
                    <div class="tool-loading-sub" id="toolLoadingSub"></div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <span id="statusText">就绪</span>
            <span class="status-build" id="statusBuild" title="构建版本"></span>
        </div>
    </div>
</div>

<div class="loading-bar" id="loadingBar"></div>
<div class="toast" id="toast"></div>

<script src="js/utils.js"></script>
<script src="js/crypto-utils.js"></script>
<script src="js/tools-registry.js"></script>
<script src="js/favorites.js"></script>
<script src="js/reference/_ref-engine.js"></script>
<script src="js/loader.js"></script>
<script src="js/router.js"></script>
<script src="js/ui-home.js"></script>
<script src="js/ui-sidebar.js"></script>
<script src="js/app.js"></script>
</body>

</html>
